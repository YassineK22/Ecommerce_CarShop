spring.application.name=AutoHub

# Fichier local optionnel (copier application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL (credentials via environment variables — do not commit real passwords)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autohub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# M5 - Compte administrateur cree au premier demarrage.
# Le mot de passe n'est jamais ecrit dans le code : il vient de l'environnement.
# Exemple : $env:APP_ADMIN_EMAIL="admin@autohub.tn" ; $env:APP_ADMIN_PASSWORD="..."
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.name=${APP_ADMIN_NAME:Administrateur}
