<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div class="card">
        <h1>Connexion</h1>

        <p th:if="${param.error}" class="alert alert-error">
            Email ou mot de passe incorrect.
        </p>
        <p th:if="${param.registered}" class="alert alert-success">
            Compte créé. Connectez-vous avec votre email.
        </p>

        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" autocomplete="username" required/>

            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required/>

            <button type="submit">Se connecter</button>
        </form>

        <p class="hint">Pas encore de compte ? <a th:href="@{/register}">S'inscrire</a></p>
    </div>
</main>
</body>
</html>
